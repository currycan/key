services:
  sb-xray:
    image: docker.io/currycan/sb-xray:26.1.23
    container_name: sb-xray
    environment:
      - DOMAIN=$domain
      - CDNDOMAIN=$cdndomain
      - DECODE=$code
      - ACMESH_DEBUG=1
      - ACMESH_SERVER_NAME=letsencrypt
      - DEST_HOST=harvard.edu
      - LISTENING_PORT=443
      - DUFS_PATH_PREFIX=/myfiles
      - XUI_WEBBASEPATH=3xadmin
      - ENABLE_ISP_PROXY=false
    ports:
      - '443:443/tcp'
      - '443:443/udp' # use UDP for usage of HTTP/3
    volumes:
      - ./pki:/pki
      - ./acmecerts:/acmecerts
      - ./.envs:/.env
      - ./sb-xray:/sb-xray
      - ./x-ui:/x-ui/db
      - ./s-ui:/s-ui/db
      - ./nginx/http:/etc/nginx/conf.d
      - ./nginx/tcp:/etc/nginx/stream.d
      - ./nginx/dhparam:/etc/nginx/dhparam
      - ./x-ui:/etc/x-ui/
      - ./data:/data
      - ./logs:/var/log
    restart: always
    tty: true
    network_mode: host
    ulimits:
      nproc: 65535
      nofile:
        soft: 65536
        hard: 65536
