proxy-providers:
  ${NODE_NAME}:
    url: https://${DOMAIN}/sb-xray/${CLIENT}
    interval: 10

proxy-groups:
  # 功能分组
  - name: 🎯 全球直连
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/CN.png
    type: select
    proxies:
      - DIRECT
  - name: 🛑 广告拦截
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png
    type: select
    proxies:
      - REJECT
  - name: 🚀 节点选择
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Static.png
    interval: 15
    lazy: true
    type: select
    proxies: &proxies
      - 👍 VLESS
      - 🧹 Hysteria2
      - 🫧 VMess
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🎯 全球直连
  - name: 🛫 手动切换
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png
    interval: 120
    lazy: true
    tolerance: 50
    type: select
    include-all: true

  - name: 🤖 Ai平台
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
    interval: 120
    lazy: true
    tolerance: 50
    type: select
    proxies:
      - 🇺🇲 美国节点
      - 🚀 节点选择
      - 🛫 手动切换
  - name: 📦 Github
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png
    interval: 120
    lazy: true
    tolerance: 50
    type: select
    proxies:
      - 🇺🇲 美国节点
      - 🚀 节点选择
      - 🛫 手动切换
  - name: 🍒 TikTok
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Media.png
    type: select
    proxies:
      - 🇰🇷 韩国节点
      - 🚀 节点选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
  - name: 🍿 Netflix
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Netflix.png
    type: select
    proxies:
      - 🚀 节点选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: ▶️ Youtube
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    proxies:
      - 🚀 节点选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: 🌍 国外媒体
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Streaming.png
    type: select
    proxies:
      - 🚀 节点选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: 🎮 游戏平台
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    proxies:
      - 🚀 节点选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: 🐟 漏网之鱼
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f41f.png
    type: select
    proxies:
      - 🚀 节点选择
      - 🛫 手动切换
      - 👍 VLESS
      - 🧹 Hysteria2
      - 🫧 VMess
      - 🎯 全球直连

  # 基于协议分组
  - name: 👍 VLESS
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Heart.png
    type: select
    filter: "(?i)vless|Reality"
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
  - name: 🫧 VMess
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Download.png
    filter: "(?i)vmess"
    type: select
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
  - name: 🧹 Hysteria2
    filter: "(?i)hysteria2|hy2"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
    type: select
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
  # - name: 🗽 TUIC
  #   filter: "(?i)tuic"
  #   icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Magic.png
  #   type: select
  #   interval: 300
  #   tolerance: 50
  #   lazy: true
  #   include-all: true

  # - name: 🎭 AnyTLS
  #   filter: "(?i)anytls"
  #   icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Lock.png
  #   type: select
  #   interval: 300
  #   tolerance: 50
  #   lazy: true
  #   include-all: true


  # 基于地区分组
  - name: 🇯🇵 日本节点
    filter: "日|🇯🇵|东京|JP|(?i)Japan"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: true
  - name: 🇺🇲 美国节点
    filter: "美|🇺🇲|US|(?i)States|American"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/United_States.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: true
  - name: 🇰🇷 韩国节点
    filter: "韩|🇰🇷|KR|(?i)Korea"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Korea.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: true
  - name: 🇭🇰 香港节点
    filter: "香港|HK|(?i)Hong"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Hong_Kong.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: true
  # - name: 🇨🇳 台湾节点
  #   filter: "台|🇹🇼|湾|TW|(?i)Taiwan"
  #   icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Taiwan.png
  #   interval: 120
  #   lazy: true
  #   tolerance: 50
  #   type: url-test
  #   include-all: true
  # - name: 🇸🇬 新加坡节点
