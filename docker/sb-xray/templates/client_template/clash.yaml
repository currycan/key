proxy-providers:
  ${NODE_NAME}:
    url: https://${DOMAIN}/sb-xray/${CLIENT}
    interval: 10

proxy-groups:
  # 功能分组
  - name: 🚀 节点选择
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Static.png
    interval: 15
    lazy: true
    type: select
    proxies: &proxies
      - 🤖 relay
      - 🔮 负载均衡
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🔯 故障转移
      - ⚡ VLESS
      - 🤡 Hysteria2
      - 🔒 Shadowsocks
      - 🛡️ Trojan
      - 🌐 VMess
      - 🇭🇰 HK 香港
      - 🇨🇳 TW 台湾
      - 🇸🇬 SG 新加坡
      - 🇰🇷 KR 节点
      - 🇯🇵 JP 日本
      - 🇺🇲 US 美国
      # - 🇩🇪 DE 德国
      # - 🇬🇧 UK 英国
      # - 🇫🇷 FR 法国
      # - 🇮🇳 IN 印度
      - 🎯 全球直连
  - name: 🤖 relay
    type: relay
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Ryan.png
    benchmark-url: http://www.apple.com # 建议只使用HTTP协议
    benchmark-timeout: 5 # 延迟测试超时，单位：秒
    proxies:
      - ⚡ VLESS
      # - 🤡 Hysteria2
      # - 🔒 Shadowsocks
      - 🛡️ Trojan
      # - 🌐 VMess
  - name: 🔮 负载均衡
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Qure.png
    interval: 120
    lazy: true
    tolerance: 50
    type: load-balance
    strategy: consistent-hashing
    include-all: true
  - name: ♻️ 自动选择
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: true
  # 代理的转发链, 在 proxies 中不应该包含 relay. 不支持 UDP.
  # 流量: clash <-> VLESS <-> Hysteria2 <-> Shadowsocks <-> Trojan <-> VMess <-> 互联网
  - name: 🛫 手动切换
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png
    interval: 120
    lazy: true
    tolerance: 50
    type: select
    include-all: true
  - name: 🔯 故障转移
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Star.png
    interval: 120
    lazy: true
    tolerance: 50
    type: fallback
    include-all: true
  - name: 🎯 全球直连
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Direct.png
    type: select
    proxies:
      - DIRECT
  - name: 🍒 TikTok
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Media.png
    type: select
    proxies:
      - 🇰🇷 KR 节点
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
  - name: 🧚 AI
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
  - name: 📺 Netflix
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Netflix.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
  - name: 🌍 国外媒体
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Streaming.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
  - name: 📹 国内媒体
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/CN.png
    type: select
    proxies:
      - 🎯 全球直连
      - 🇭🇰 HK 香港
      - 🇨🇳 TW 台湾
  - name: 🎮 游戏平台
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
  - name: 🛑 广告拦截
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png
    type: select
    proxies:
      - REJECT
      - 🎯 全球直连
  - name: 🐟 漏网之鱼
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f41f.png
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 节点选择
      - 🎯 全球直连

  # 基于地区分组
  - name: 🇭🇰 HK 香港
    filter: "香港|HK|(?i)Hong"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Hong_Kong.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: true
  - name: 🇨🇳 TW 台湾
    filter: "台|🇹🇼|湾|TW|(?i)Taiwan"
