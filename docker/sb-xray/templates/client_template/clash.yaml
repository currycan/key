proxy-providers:
  ${NODE_NAME}:
    url: https://${DOMAIN}/sb-xray/${CLIENT}
    interval: 10

proxy-groups:
  # 功能分组
  - name: 🎯 全球直连
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Direct.png
    type: select
    proxies:
      - DIRECT
  - name: 🛑 广告拦截
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png
    type: select
    proxies:
      - REJECT
  - name: 🚀 节点选择
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Static.png
    interval: 15
    lazy: true
    type: select
    proxies: &proxies
      - 👍 VLESS
      - 🧹 Hysteria2
      - 🫧 VMess
      - 🛫 手动切换
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🎯 全球直连
  - name: 🛫 手动切换
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png
    interval: 120
    lazy: true
    tolerance: 50
    type: select
    include-all: true
  - name: ♻️ 自动选择
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: true
  - name: 🔯 故障转移
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Star.png
    interval: 120
    lazy: true
    tolerance: 50
    type: fallback
    include-all: true
  - name: 🔮 负载均衡
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Qure.png
    interval: 120
    lazy: true
    tolerance: 50
    type: load-balance
    strategy: consistent-hashing
    include-all: true
  - name: 🤖 Ai平台
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
    interval: 120
    lazy: true
    tolerance: 50
    type: select
    proxies:
      - 🇺🇲 美国节点
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
  - name: 📦 Github
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png
    interval: 120
    lazy: true
    tolerance: 50
    type: select
    proxies:
      - 🇺🇲 美国节点
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
  - name: 🍒 TikTok
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Media.png
    type: select
    proxies:
      - 🇰🇷 韩国节点
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
  - name: 🍿 Netflix
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Netflix.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: ▶️ Youtube
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: 📲 电报消息
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram_X.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: 🌍 国外媒体
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Streaming.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: 🌏 国内媒体
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/CN.png
    type: select
    proxies:
      - 🎯 全球直连
      - 🛫 手动切换
  - name: 🎮 游戏平台
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
  - name: 🐟 漏网之鱼
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f41f.png
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🛫 手动切换
      - 👍 VLESS
      - 🧹 Hysteria2
      - 🫧 VMess
      - 🎯 全球直连


  # 基于协议分组
  - name: 👍 VLESS
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Heart.png
    type: select
    filter: "(?i)vless|Reality"
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
  - name: 🫧 VMess
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Download.png
    filter: "(?i)vmess"
    type: select
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
  - name: 🧹 Hysteria2
    filter: "(?i)hysteria2|hy2"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
    type: select
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
  # - name: 🗽 TUIC
  #   filter: "(?i)tuic"
  #   icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Magic.png
