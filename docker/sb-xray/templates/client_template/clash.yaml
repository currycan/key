dns:
  enable: true
  ipv6: false
  listen: :23453
  enhanced-mode: redir-host
  respect-rules: true
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  nameserver-policy:
    geosite:cn,private: https://120.53.53.53/dns-query
    geosite:geolocation-!cn: https://dns.cloudflare.com/dns-query
    "+.steampowered.com": "223.5.5.5"
    "geosite:cn,apple,bilibili": https://doh.pub/dns-query
  nameserver:
    - tls://jp01.dns4me.net
    - https://dns.csaonline.de/dns-query
    - tls://unfiltered.adguard-dns.com
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
clash-for-android:
  append-system-dns: false
unified-delay: true
global-client-fingerprint: chrome
keep-alive-interval: 360
