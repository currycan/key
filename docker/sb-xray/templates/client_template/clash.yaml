    type: select
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
  - name: 🧹 Hysteria2
    filter: "(?i)hysteria2|hy2"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
    type: select
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
