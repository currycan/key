  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  nameserver-policy:
    geosite:cn,private: https://120.53.53.53/dns-query
    geosite:geolocation-!cn: https://dns.cloudflare.com/dns-query
    "+.steampowered.com": "223.5.5.5"
    "geosite:cn,apple,bilibili": https://doh.pub/dns-query
  nameserver:
    - tls://jp01.dns4me.net
    - https://dns.csaonline.de/dns-query
    - tls://unfiltered.adguard-dns.com
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
