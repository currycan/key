# ==================== 锚点配置 ====================
# 代理提供者模板 - 订阅源基础配置
BaseProvider: &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: "https://www.google.com/generate_204", interval: 300}, filter: "^(?!.*(❗|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))"}

# 策略组类型模板 - 定义不同的策略组基础配置
BaseFB: &BaseFB {type: fallback, interval: 200, lazy: true, url: "https://www.google.com/generate_204"}
BaseCH: &BaseCH {type: load-balance, interval: 200, lazy: true, url: "https://www.google.com/generate_204", strategy: consistent-hashing, hidden: true}
BaseCR: &BaseCR {type: load-balance, interval: 200, lazy: true, url: "https://www.google.com/generate_204", strategy: round-robin, hidden: true}
BaseUT: &BaseUT {type: url-test, interval: 200, lazy: true, url: "https://www.google.com/generate_204", hidden: true}

# 全部节点筛选正则表达式 - 所有节点
FilterALL: &FilterALL "^(?!.*(❗|DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))"
# 节点筛选正则表达式 - 基于地理位置过滤
FilterUS: &FilterUS "^(?=.*(?i)(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States))(?!.*(排除1|排除2|5x)).*$"
FilterHK: &FilterHK "^(?=.*(?i)(广港|香港|HK|Hong Kong|🇭🇰|HongKong))(?!.*(排除1|排除2|5x)).*$"
FilterTW: &FilterTW "^(?=.*(?i)(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan))(?!.*(排除1|排除2|5x)).*$"
FilterSG: &FilterSG "^(?=.*(?i)(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore))(?!.*(排除1|排除2|5x)).*$"
FilterJP: &FilterJP "^(?=.*(?i)(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan))(?!.*(排除1|排除2|5x)).*$"
FilterKR: &FilterKR "^(?=.*(?i)(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea))(?!.*(排除1|排除2|5x)).*$"
FilterOT: &FilterOT "^(?!.*(DIRECT|REJECT|直接连接|原生|家宽|住宅|isp|ISP|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States))"


# 节点筛选正则表达式 - 基于协议过滤
FilterVLESS: &FilterVLESS "^(?=.*(?i)(vless|reality))(?!.*(排除1|排除2|5x)).*$"
FilterVMess: &FilterVMess "^(?=.*(?i)(vmess))(?!.*(排除1|排除2|5x)).*$"
FilterHy2: &FilterHy2 "^(?=.*(?i)(hysteria2|hy2))(?!.*(排除1|排除2|5x)).*$"
FilterTUIC: &FilterTUIC "^(?=.*(?i)(tuic))(?!.*(排除1|排除2|5x)).*$"
FilterAnyTLS: &FilterAnyTLS "^(?=.*(?i)(anytls))(?!.*(排除1|排除2|5x)).*$"
# 节点筛选正则表达式 - 家宽节点
FilterISP: &FilterISP "^(?=.*(?i)(家宽|住宅|isp|ISP))(?!.*(排除1|排除2|5x)).*$"
FilterNative: &FilterNative "^(?=.*(?i)(原生|流媒体))(?!.*(排除1|排除2|5x)).*$"
# 节点筛选正则表达式 - 高速节点
FilterFAST: &FilterFAST "^(?=.*(?i)(高速))(?!.*(排除1|排除2|5x)).*$"
# 节点筛选正则表达式 - 过滤链式代理节点
FilterDialer: &FilterDialer "^(?!.*(DIRECT|直接连接|REJECT|isp-dialer))"

