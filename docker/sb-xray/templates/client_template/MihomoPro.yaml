SelectPY: &SelectPY {type: select, proxies: [默认代理, 故障转移, 香港-故转, 狮城-故转, 日本-故转, 韩国-故转, 美国-故转, 台湾-故转, 欧盟-故转, VLESS-故转, VMess-故转, Hysteria2-故转, TUIC-故转, AnyTLS-故转, 冷门自选, 全球手动, 直接连接]}
