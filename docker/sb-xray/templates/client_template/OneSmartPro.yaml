# ==================== 代理提供者 ====================
# 注意：请提供您的机场订阅链接，每个链接一行，并为每个机场命名，末尾的[优][备]为每个节点添加机场名称前缀，可自定义
proxy-providers:
  ${NODE_NAME}: {<<: *BaseProvider, url: "https://${DOMAIN}/sb-xray/${CLIENT}", override: {additional-prefix: "[${NODE_NAME}] ", additional-suffix: " [优]"}}
  # # 优质订阅源 - 优质节点集合，使用时请修改
  # 优质服务商: {<<: *BaseProvider, url: "优质订阅源地址", override: {additional-suffix: " [优]"}}
  # # 备用订阅源 - 次优节点集合，使用时请修改
  # 备用服务商: {<<: *BaseProvider, url: "备用订阅源地址", override: {additional-suffix: " [备]"}}
  # # 落地订阅源 - 落地服务连接，使用时请修改
  # 落地服务商: {<<: *BaseProvider, url: "落地订阅源地址", override: {additional-suffix: " [中]", dialer-proxy: 落地节点}}

proxies:
  # 发往 la-isp-dialer 的流量先经过 "链式前置"，从而实现指定下一跳代理的效果
  - name: la-isp-dialer        # 落地节点命名
    type: socks5               # 节点协议
    server: ${ISP_IP}          # 住宅IP 代理地址
    port: ${ISP_PORT}          # 端口号
    username: ${ISP_USER}      # 用户名
    password: ${ISP_SECRET}    # 密码
    udp: true
    dialer-proxy: 链式前置      # 指定前置代理节点组


# ==================== 策略组 ====================
proxy-groups:
  # ==================== 主要策略组 ====================
  - {name: 落地节点,    <<: *BaseLB,     use: ["${NODE_NAME}"], filter: *FilterISP,     icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Daily.png}
  - {name: 链式前置,    <<: *BaseSmart,  include-all: true,     filter: *FilterDialer, policy-priority: "优:5;中:1;备:0.5",  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png}
  - {name: 一键智选,    <<: *SelectAll,  icon: https://git.imee.me/https://github.com/666OS/YYDS/raw/main/mihomo/image/mihomo.png}
  - {name: 国外流量,    <<: *SelectHQ,   icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Global.png}
  - {name: 国内流量,    <<: *SelectDC,   icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/China.png}
  - {name: 兜底流量,    <<: *SelectHQ,   icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Final.png}
  # ==================== 网络测试 ====================
  - {name: 网络测试,    <<: *SelectAll,  include-all: true,     filter: *FilterALL,     icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Speedtest.png}
  # ==================== AI 服务 ====================
  - {name: 人工智能,    <<: *SelectHQ,   icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/AI.png}
  # ==================== 媒体服务 ====================
