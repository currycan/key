# ==================== 锚点配置 ====================
# 代理提供者模板 - 订阅源基础配置
BaseProvider:   &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: "https://www.google.com/generate_204", interval: 300}, filter: "^(?!.*(❗|群(?!岛)|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|套餐|有效|剩余|失联|测试|官方|学术|更快|如果|客户|距离|Traffic|Reset|Days|Left|TEST|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|\\d+\\s*GB))"}

# 策略组类型模板 - 定义不同的策略组基础配置
BaseFB:         &BaseFB    {type: fallback,     interval: 180, tolerance: 100, lazy: true, url: "https://www.google.com/generate_204"}
BaseLB:         &BaseLB    {type: load-balance, interval: 180, tolerance: 100, lazy: true, url: "https://www.google.com/generate_204"}
BaseSmart:      &BaseSmart {type: smart,        interval: 180, tolerance: 100, lazy: true, url: "https://www.google.com/generate_204", hidden: true, uselightgbm: true, collectdata: true}

# 全部节点筛选正则表达式 - 所有节点
FilterALL:      &FilterALL "^(?!.*(❗|DIRECT|直接连接|群(?!岛)|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|套餐|有效|剩余|失联|测试|官方|学术|更快|如果|客户|距离|Traffic|Reset|Days|Left|TEST|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|\\d+\\s*GB))"
# 节点筛选正则表达式 - 基于地理位置过滤
FilterUS:       &FilterUS  "^(?=.*(?i)(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|美[国國]|华盛顿|菲尼克斯|弗里蒙特|硅谷|旧金山|拉斯维加斯|圣荷西|哥伦布|阿什本|纽瓦克|丹佛|加利福尼亚|弗吉尼亚|马纳萨斯|俄亥俄|得克萨斯|[佐乔]治亚|亚特兰大|佛罗里达|迈阿密|United[\\s-_]+States|Los[\\s-_]+Angeles|San[\\s-_]+Jose|Silicon[\\s-_]+Valley|San[\\s-_]+Francisco|Santa[\\s-_]+Clara|Seattle|Chicago|New[\\s-_]+York|Miami|Dallas|Phoenix|Fremont|Atlanta|Boston|Las[\\s-_]+Vegas|Houston|Ashburn|Buffalo|Washington|D\\.C\\.|Oregon|Portland|Virginia|Ohio|Texas|Florida|Illinois|Arizona|Orem|Kansas))(?!.*(排除1|排除2|5x)).*$"
FilterHK:       &FilterHK  "^(?=.*(?i)(广港|香港|HK|Hong Kong|🇭🇰|HongKong|深港|沪港|呼港|京港|杭港|Hong[\\s-]?Kong|HONG[\\s-]?KONG))(?!.*(排除1|排除2|5x)).*$"
FilterTW:       &FilterTW  "^(?=.*(?i)(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|新[北竹]|彰化|高雄|[台臺][湾灣北]|Taipei|Kaohsiung|Hsinchu|Taichung))(?!.*(排除1|排除2|5x)).*$"
FilterSG:       &FilterSG  "^(?=.*(?i)(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|[狮獅]城|Changi))(?!.*(排除1|排除2|5x)).*$"
FilterJP:       &FilterJP  "^(?=.*(?i)(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|名古屋|福冈|Tokyo|Osaka|Saitama|Nagoya|Fukuoka|Hokkaido|Okinawa|Kyoto|Yokohama))(?!.*(排除1|排除2|5x)).*$"
FilterKR:       &FilterKR  "^(?=.*(?i)(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|[韩韓][国國]|South[\\s-]?Korea|Seoul|Incheon|Busan|Chuncheon))(?!.*(排除1|排除2|5x)).*$"
FilterOT:       &FilterOT  "^(?!.*(DIRECT|REJECT|直接连接|住宅|isp|ISP|广港|香港|HK|Hong Kong|🇭🇰|HongKong|深港|沪港|呼港|京港|杭港|Hong[\\s-]?Kong|HONG[\\s-]?KONG|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|新[北竹]|彰化|高雄|[台臺][湾灣北]|Taipei|Kaohsiung|Hsinchu|Taichung|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|名古屋|福冈|Tokyo|Osaka|Saitama|Nagoya|Fukuoka|Hokkaido|Okinawa|Kyoto|Yokohama|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|[狮獅]城|Changi|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|[韩韓][国國]|South[\\s-]?Korea|Seoul|Incheon|Busan|Chuncheon|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|美[国國]|华盛顿|菲尼克斯|弗里蒙特|硅谷|旧金山|拉斯维加斯|圣荷西|哥伦布|阿什本|纽瓦克|丹佛|加利福尼亚|弗吉尼亚|马纳萨斯|俄亥俄|得克萨斯|[佐乔]治亚|亚特兰大|佛罗里达|迈阿密|United[\\s-_]+States|Los[\\s-_]+Angeles|San[\\s-_]+Jose|Silicon[\\s-_]+Valley|San[\\s-_]+Francisco|Santa[\\s-_]+Clara|Seattle|Chicago|New[\\s-_]+York|Miami|Dallas|Phoenix|Fremont|Atlanta|Boston|Las[\\s-_]+Vegas|Houston|Ashburn|Buffalo|Washington|D\\.C\\.|Oregon|Portland|Virginia|Ohio|Texas|Florida|Illinois|Arizona|Orem|Kansas))(?!.*(排除1|排除2|5x)).*$"

# 节点筛选正则表达式 - 家宽节点
FilterISP:      &FilterISP    "^(?=.*(?i)(住宅|isp|ISP))(?!.*(排除1|排除2|5x)).*$"
FilterMedia:    &FilterMedia  "^(?=.*(?i)(流媒体|SsrDog))(?!.*(排除1|排除2|5x)).*$"
# 节点筛选正则表达式 - 高速节点
FilterFAST:     &FilterFAST   "^(?=.*(?i)(高速))(?!.*(排除1|排除2|5x)).*$"
# 节点筛选正则表达式 - AI节点
FilterAI:       &FilterAI     "^(?=.*(?i)(AI|AllOne))(?!.*(排除1|排除2|5x|racknerd|hostdare|zorocloud)).*$"
# 节点筛选正则表达式 - 过滤链式代理节点
FilterDialer:   &FilterDialer "^(?=.*(?i)(🇭🇰|🇹🇼|🇨🇳))(?!.*(DIRECT|直接连接|REJECT|isp-dialer)).*$"

# Policy-Priority 模板 - 智能节点选择权重配置
# 设计理念: filter 负责筛选节点范围, policy-priority 负责在筛选结果中进行多维度排序
# 权重维度: 机场标识(10) + 特性标签(10) + 协议性能(2-10) + 地区偏好(2-10) + 质量后缀(1-5)
# 协议优先级: Reality/vless(10) > hysteria2(8) > V2ray/vmess(6) > tuic(4) > anytls(2)
# 地区优先级: 美国🇺🇸(10) > 韩国🇰🇷(8) > 日本🇯🇵(6) > 新加坡🇸🇬(4) > 香港🇭🇹(2)
# 特性标签: 高速(10)
PolicyDefault:  &PolicyDefault  "AllOne:10;高速:10;Reality:10;vless:10;hysteria2:8;V2ray:6;vmess:6;tuic:4;TUIC:4;anytls:2;优:5;中:2;备:1"
PolicyISP:      &PolicyISP      "AllOne:10;高速:10;Reality:10;vless:10;hysteria2:8;V2ray:6;vmess:6;tuic:4;TUIC:4;anytls:2;优:5;中:2;备:1;🇺🇸:10;🇰🇷:8;🇯🇵:6;🇸🇬:4;🇭🇹:2"
PolicyMedia:    &PolicyMedia    "AllOne:10;高速:10;Reality:10;vless:10;hysteria2:8;V2ray:6;vmess:6;tuic:4;TUIC:4;anytls:2;优:5;中:2;备:1;🇺🇸:10;🇰🇷:8;🇯🇵:6;🇸🇬:4;🇭🇹:2"
PolicyFast:     &PolicyFast     "AllOne:10;高速:10;Reality:10;vless:10;hysteria2:8;V2ray:6;vmess:6;tuic:4;TUIC:4;anytls:2;优:5;中:2;备:1;🇺🇸:10;🇯🇵:6;🇰🇷:8;🇸🇬:4;🇭🇹:2"
PolicyAI:       &PolicyAI       "AllOne:10;高速:10;Reality:10;vless:10;hysteria2:8;V2ray:6;vmess:6;tuic:4;TUIC:4;anytls:2;优:5;中:2;备:1;🇺🇸:10;🇯🇵:6;🇰🇷:6;🇸🇬:4;🇭🇹:2"
PolicyDialer:   &PolicyDialer   "🇭🇰:10;🇹🇼:5:🇨🇳:5"

# 策略组代理列表模板 - 预定义的代理节点优先级排序
DEFAULT:        &DEFAULT     {type: select, proxies: [低延迟线路, 家宽线路, 高速线路, 媒体线路, AI线路, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动, 直接连接]}
OneSmart:       &OneSmart     {type: select, proxies: [默认代理, 低延迟线路, 家宽线路, 高速线路, 媒体线路, AI线路, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动, 直接连接]}
SelectDC:       &SelectDC     {type: select, proxies: [直接连接, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动]}

SelectLD:       &SelectLD     {type: select, proxies: [低延迟线路, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动, 直接连接]}
SelectISP:      &SelectISP    {type: select, proxies: [家宽线路, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动, 直接连接]}
SelectMedia:    &SelectMedia  {type: select, proxies: [媒体线路, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动, 直接连接]}
SelectFAST:     &SelectFAST   {type: select, proxies: [高速线路, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动, 直接连接]}
SelectAI:       &SelectAI     {type: select, proxies: [AI线路, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 全球手动, 直接连接]}


# ==================== 代理提供者 ====================
# 注意：请提供您的机场订阅链接，每个链接一行，并为每个机场命名，末尾的[优][备]为每个节点添加机场名称前缀，可自定义
proxy-providers:
  ${NODE_NAME}: {<<: *BaseProvider, url: "https://${DOMAIN}/sb-xray/clashsub", override: {additional-prefix: "[${NODE_NAME}] ", additional-suffix: " [优]"}}
  # # 优质订阅源 - 优质节点集合，使用时请修改
  # 优质服务商: {<<: *BaseProvider, url: "优质订阅源地址", override: {additional-suffix: " [优]"}}
  # # 备用订阅源 - 次优节点集合，使用时请修改
  # 备用服务商: {<<: *BaseProvider, url: "备用订阅源地址", override: {additional-suffix: " [备]"}}
  # # 落地订阅源 - 落地服务连接，使用时请修改
  # 落地服务商: {<<: *BaseProvider, url: "落地订阅源地址", override: {additional-suffix: " [中]", dialer-proxy: 链式前置}}

proxies:
  # 发往 la-isp-dialer 的流量先经过 "链式前置"，从而实现指定下一跳代理的效果
  - name: la-isp-dialer        # 落地节点命名
    type: socks5               # 节点协议
    server: ${ISP_IP}          # 住宅IP 代理地址
    port: ${ISP_PORT}          # 端口号
    username: ${ISP_USER}      # 用户名
    password: ${ISP_SECRET}    # 密码
    udp: true
    dialer-proxy: 链式前置      # 指定前置代理节点组


# ==================== 策略组 ====================
proxy-groups:
  # ==================== 主要策略组 ====================
  - {name: 默认代理,    <<: *DEFAULT,    icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Static.png}
  - {name: 一键智选,    <<: *OneSmart,   icon: https://git.imee.me/https://github.com/666OS/YYDS/raw/main/mihomo/image/mihomo.png}
  - {name: 国外流量,    <<: *OneSmart,   icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Global.png}
  - {name: 国内流量,    <<: *SelectDC,   icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/China.png}
  - {name: 兜底流量,    <<: *OneSmart,   icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Final.png}
  # ==================== 网络测试 ====================
  - {name: 网络测试,    <<: *OneSmart,  include-all: true, filter: *FilterALL, icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Speedtest.png}

  # ==================== 家宽节点策略组 ====================
  - {name: 家宽-智选,    <<: *BaseSmart, filter: *FilterISP,    include-all: true, policy-priority: *PolicyISP, icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Area.png}
  # ==================== 媒体节点策略组 ====================
  - {name: 媒体-智选,    <<: *BaseSmart, filter: *FilterMedia,  include-all: true, policy-priority: *PolicyMedia, icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Clubhouse_1.png}
  # ==================== 高速节点策略组 ====================
  - {name: 高速-智选,    <<: *BaseSmart, filter: *FilterFAST,   include-all: true, policy-priority: *PolicyFast, icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Rocket.png}
  # ==================== AI节点策略组 ====================
  - {name: AI-智选,     <<: *BaseSmart, filter: *FilterAI,     include-all: true, policy-priority: *PolicyAI, icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/AI.png}

  # 线路特性层 - Fallback故障转移，按特性优化线路选择，建议修改位置顺序发挥线路优势
  - {name: 低延迟线路,   <<: *BaseFB,    proxies: [香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 家宽-智选, 媒体-智选, 高速-智选, 全球手动, 直接连接], icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Round_Robin_1.png}
  - {name: 家宽线路,     <<: *BaseFB,    proxies: [家宽-智选, 媒体-智选, 美国-智选, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 其他-智选, 高速-智选, 全球手动, 直接连接], icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Area.png}
  - {name: 高速线路,     <<: *BaseFB,    proxies: [高速-智选, 美国-智选, 日本-智选, 香港-智选, 台湾-智选, 狮城-智选, 韩国-智选, 其他-智选, 家宽-智选, 媒体-智选, 全球手动, 直接连接], icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Rocket.png}
  - {name: 媒体线路,     <<: *BaseFB,    proxies: [媒体-智选, 家宽-智选, 香港-智选, 台湾-智选, 日本-智选, 狮城-智选, 韩国-智选, 美国-智选, 其他-智选, 高速-智选, 全球手动, 直接连接], icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Clubhouse_1.png}
  - {name: AI线路,     <<: *BaseFB,     proxies: [AI-智选, 美国-智选, 家宽-智选, 日本-智选, 狮城-智选, 韩国-智选, 其他-智选, 香港-智选, 台湾-智选, 媒体-智选, 高速-智选, 全球手动, 直接连接], icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Clubhouse_1.png}
  # ==================== 全球手动策略组 ====================
  - {name: 全球手动,    <<: *BaseSmart,  include-all: true, policy-priority: *PolicyDefault, icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Static.png}

  # ==================== AI 服务 ====================
  - {name: 人工智能,    <<: *SelectAI,    icon: https://git.imee.me/https://github.com/Koolson/Qure/raw/master/IconSet/Color/AI.png}
