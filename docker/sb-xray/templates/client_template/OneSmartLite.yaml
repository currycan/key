# ==================== 规则路由 ====================
rules:
  # Tailscale 组网 IP 段
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  # ZeroTier 虚拟内网 IP 段
  - IP-CIDR,192.168.192.0/24,DIRECT,no-resolve
  - IP-CIDR,10.242.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.28.0.0/16,DIRECT,no-resolve
  # 私有网络 IP 段
  - IP-CIDR, 192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR, 172.168.0.0/12,DIRECT,no-resolve
  - IP-CIDR, 10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR, 127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR, ::1/128,DIRECT,no-resolve
  # 拦截规则
  - RULE-SET,Tracking / Domain,REJECT
  - RULE-SET,Advertising / Domain,REJECT
  - RULE-SET,AdvertisingIP / IP,REJECT,no-resolve
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT  # 阻止 QUIC
  - RULE-SET,Block / Domain,REJECT
  # - GEOSITE,category-ads-all,REJECT
  # Test
  - RULE-SET,TEST / Domain,网络测试
  # 国内流量
  - RULE-SET,LocationDKS / Domain,国内流量
  - RULE-SET,BiliBili / Domain,国内流量
  - RULE-SET,Direct / Domain,直接连接
  - RULE-SET,Private / Domain,直接连接
  - RULE-SET,PrivateIP / IP,直接连接,no-resolve
  - RULE-SET,Direct / Domain,直接连接
  - RULE-SET,China / Domain,直接连接
  - RULE-SET,ChinaIP / IP,直接连接,no-resolve
  # AI
  - RULE-SET,ChatGPT / Domain,人工智能
  - RULE-SET,Claude / Domain,人工智能
  - RULE-SET,Copilot / Domain,人工智能
  - RULE-SET,Gemini / Domain,人工智能
  - RULE-SET,Groq / Domain,人工智能
  - RULE-SET,Grok / Domain,人工智能
  - RULE-SET,Meta AI / Domain,人工智能
  - RULE-SET,Perplexity / Domain,人工智能
  - RULE-SET,AI / Domain,人工智能
  - RULE-SET,AIIP / IP,人工智能,no-resolve
  # 国外媒体
  - RULE-SET,TikTok / Domain,TikTok
  - RULE-SET,YouTube / Domain,YouTube
  # 国外公司
  - RULE-SET,Google / Domain,谷歌服务
  - RULE-SET,GoogleIP / IP,谷歌服务,no-resolve
  - RULE-SET,GitHub / Domain,GitHub
  # Fallback / General
  - RULE-SET,Proxy / Domain,国外流量
  - RULE-SET,ProxyIP / IP,国外流量,no-resolve
  - RULE-SET,Globe / Domain,国外流量
  # GeoIP/Site
  - GEOIP,PRIVATE,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  # Final
  - MATCH,兜底流量


