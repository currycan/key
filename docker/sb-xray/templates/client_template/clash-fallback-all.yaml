# ========================
# Clash-ALL 优化配置
# ========================

# 机场节点订阅

proxy-providers:

  ${NODE_NAME}:
    url: https://${DOMAIN}/sb-xray/${CLIENT}
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
    proxy: 直连

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

  - name: la-isp-dialer        # 落地节点命名
    type: socks5               # 节点协议
    server: ${ISP_IP}          # 住宅IP 代理地址
    port: 9298                 # 端口号
    username: ${ISP_USER}      # 用户名
    password: ${ISP_SECRET}    # 密码
    udp: true
    dialer-proxy: 链式前置       # 指定前置代理节点组


# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 所有-手动
    - 所有-自动
    - 日本-故转
    - 美国-故转
    - 韩国-故转
    - 香港-故转
    # - 台湾-故转
    # - 新加坡-故转
    - VLESS-故转
    - Hysteria2-故转
    - VMess-故转
    - TUIC-故转
    - AnyTLS-故转
    - Shadowsocks-故转
    - 其他-故转
    - 拒绝

normal-media: &normal-media
  type: select
  proxies:
    - 美国-故转
    - 日本-故转

isp-media: &isp-media
  type: select
  proxies:
    - 韩国-故转
    - 日本-故转
    - 美国-故转

com: &com
  type: select
  proxies:
    - 直连
    - 美国-故转

game: &game
  type: select
  proxies:
    - 美国-故转
    - 日本-故转
    - 韩国-故转
    - 香港-故转

proxy-groups:
  # 链式代理-前置
  - name: 链式前置
    type: select
    proxies:
      - 日本-自动
      - 美国-自动
      - 韩国-自动
      - 香港-自动
      # - 台湾-自动
      # - 新加坡-自动
      - 其他-自动

  # 业务分流组
  ## Test
  - {name: Test, <<: *default}
  - {name: 其他, <<: *default}
  - {name: 国外, <<: *normal-media}
  ## Com
  - {name: Apple, <<: *com}
  - {name: Microsoft, <<: *com}
  - {name: Nvidia, <<: *com}
  ## AI
  - {name: AI, type: select, proxies: [美国-故转]}
  ## Tech
  - {name: Google, type: select, proxies: [美国-故转]}
  - {name: GitHub, type: select, proxies: [美国-故转]}
  - {name: Reddit, type: select, proxies: [美国-故转]}
  ## Media
  - {name: Telegram, <<: *normal-media}
  - {name: Twitter(X), <<: *normal-media}
  - {name: WhatsApp, <<: *normal-media}
  - {name: Facebook, <<: *normal-media}
  - {name: BiliBili, type: select, proxies: [直连]}
  - {name: YouTube, <<: *normal-media}
  - {name: TikTok, <<: *isp-media}
  - {name: Netflix, <<: *isp-media}
  - {name: HBO, <<: *isp-media}
  - {name: Disney, <<: *isp-media}
  - {name: Amazon, <<: *isp-media}
  - {name: Crunchyroll, <<: *normal-media}
  - {name: Popcorn, <<: *normal-media}
  - {name: Spotify, <<: *normal-media}
  ## Game
  - {name: Steam, <<: *game}
  - {name: Games, <<: *game}
  - {name: Crypto, <<: *game}
  ## Others
  - {name: 国内, type: select, proxies: [直连]}
  - {name: Block, type: select, proxies: [拒绝]}

  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(直连|拒绝)).)*$"

  # 美国组
